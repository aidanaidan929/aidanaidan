name: Deploy site with Git LFS

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true  # ✅ pulls your videos and other large files

      - name: Install Git LFS
        run: git lfs install

      - name: Fetch LFS files
        run: git lfs pull

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .  # uploads your whole website (HTML, CSS, videos, etc.)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
